name: Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Docker Image via Nix
        run: |
          nix-build --option sandbox false docker.nix -o PropProp.tar.gz
        env:
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1

      - name: Verify Build
        run: |
          if [ -L PropProp.tar.gz ]; then
            echo "Build successful! PropProp.tar.gz created."
          else
            echo "Build failed! PropProp.tar.gz not found."
            exit 1
          fi
