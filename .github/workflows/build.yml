name: Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Claim disk space
        run: |
          # Remove unused tools
          sudo rm -rf /opt/microsoft
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build Docker Image via Nix
        run: |
          sudo chmod 755 /run/containers
          sudo mkdir -p "/run/containers/$(id -u runner)"
          sudo chown runner: "/run/containers/$(id -u runner)"
          nix-build --option sandbox false docker.nix -o propprop.tar.gz
        env:
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM: 1

      - name: Verify Build
        run: |
          if [ -L propprop.tar.gz ]; then
            echo "Build successful! propprop.tar.gz created."
          else
            echo "Build failed! propprop.tar.gz not found."
            exit 1
          fi
